<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Aviation Blog</title>
  <meta name="description" content="Apex Aviation's pilot resources and blog have moved to individual pages for each post." />
  <link rel="canonical" href="https://apexaviationtx.com/blog" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!--
    This was the client-side blog post renderer -- it fetched a
    posts/<slug>.md file based on a ?post= query param and rendered it
    into a single shared page shell, built Oct 30 2026. The problem:
    every post shared the exact same generic <title>/description in the
    initial HTML (only patched in by JS after the fetch resolved), no
    OG/Twitter tags at all, and no Article schema -- meaning every post
    URL looked identical and content-free to anything that doesn't
    execute JS (search engine first-pass crawl, social link previews,
    etc.), undermining the very SEO goal the posts were written for.
    All 7 posts that were served this way (plus the 2 that were already
    static but orphaned from the blog index) are now real static pages
    -- blog-<slug>.html, each with its own real title, meta description,
    canonical, OG/Twitter tags, and Article JSON-LD, same convention as
    every other page on this site -- and linked from blog.html's index.
    Redirected rather than deleted since old ?post= links may be saved
    or shared somewhere; this sends them to the blog index instead of
    404ing. The source markdown in posts/ is left in place as the
    original drafts, just no longer served directly.
  -->
  <meta http-equiv="refresh" content="0; url=blog.html" />
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JFPBCF2GXE"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-JFPBCF2GXE');</script>
  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1049117198055794');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1049117198055794&ev=PageView&noscript=1"
  /></noscript>
  <script>
    window.location.replace('blog.html' + window.location.search);
  </script>
  <style>
    body { background:#0B1F3A; color:rgba(255,255,255,0.75); font-family:-apple-system,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; padding:24px; }
    a { color:#F4B400; }
  </style>
</head>
<body>
  <p>This post has moved — redirecting to <a href="blog">the blog</a>…</p>
</body>
</html>
