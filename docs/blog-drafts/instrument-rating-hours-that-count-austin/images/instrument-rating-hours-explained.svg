<text x="115" y="245" font-family="Arial,sans-serif" font-size="76" fill="#0B1F3A" font-weight="bold">50 HOURS</text><text x="115" y="305" font-family="Arial,sans-serif" font-size="33" fill="#0B1F3A" font-weight="bold">Cross-country PIC time</text><text x="115" y="368" font-family="Arial,sans-serif" font-size="26" fill="#526276" font-weight="normal">At least 10 hours in an airplane</text><text x="115" y="435" font-family="Arial,sans-serif" font-size="25" fill="#526276" font-weight="normal">Requires qualifying PIC logging</text><text x="115" y="480" font-family="Arial,sans-serif" font-size="25" fill="#526276" font-weight="normal">and applicable cross-country criteria</text><text x="765" y="245" font-family="Arial,sans-serif" font-size="76" fill="#0B1F3A" font-weight="bold">40 HOURS</text><text x="765" y="305" font-family="Arial,sans-serif" font-size="30" fill="#0B1F3A" font-weight="bold">Actual or simulated instrument time</text><text x="765" y="368" font-family="Arial,sans-serif" font-size="25" fill="#526276" font-weight="normal">At least 15 hours of qualifying instruction</text><text x="765" y="435" font-family="Arial,sans-serif" font-size="25" fill="#526276" font-weight="normal">Only qualifying instrument time counts</text><text x="765" y="480" font-family="Arial,sans-serif" font-size="25" fill="#526276" font-weight="normal">Device credit follows separate limits</text><text x="83" y="671" font-family="Arial,sans-serif" font-size="27" fill="#0B1F3A" font-weight="bold">These are different requirements. A single flight may qualify toward both only if it meets each rule.</text>
 <text x="82" y="758" font-family="Arial,sans-serif" font-size="21" fill="#526276">Educational overview · 14 CFR § 61.65(d) · Check current requirements and individual eligibility</text>
